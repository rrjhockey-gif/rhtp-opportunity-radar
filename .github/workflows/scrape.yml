name: Daily scrub

on:
  schedule:
    - cron: "0 11 * * *" # 6:00 AM ET (11:00 UTC) daily
  workflow_dispatch: {} # lets you click "Run workflow" for an on-demand scrub

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/scrape.mjs

      - name: Commit updated data
        run: |
          git config user.name "rhtp-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/opportunities.json site/data/scrub-log.json site/data/meta.json
          git diff --cached --quiet && echo "No data changes" || git commit -m "Daily scrub: update tracked opportunities"
          git push
